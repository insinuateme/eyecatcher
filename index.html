<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4A8FE7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Eyecatcher — Video Date</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: #4A8FE7;
            color: #fff;
            padding: 0 24px;
            -webkit-tap-highlight-color: transparent;
        }

        .spacer-top {
            flex: 1;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .logo-circle {
            width: 100px;
            height: 100px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-circle svg {
            width: 60px;
            height: 60px;
        }

        .brand-name {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .brand-sub {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 36px;
        }

        .headline {
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .btn {
            background: #fff;
            color: #4A8FE7;
            border: none;
            padding: 16px 24px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            -webkit-user-select: none;
            user-select: none;
            width: 100%;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .spacer-bottom {
            flex: 1;
        }

        .terms {
            padding: 20px 24px 36px;
            font-size: 0.7rem;
            opacity: 0.7;
            text-align: center;
            line-height: 1.5;
        }

        .terms a {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="spacer-top"></div>
    <div class="content">
        <div class="logo-circle">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Eyelash left: curves up and to the left -->
                <path d="M38 34 Q32 18 24 12" stroke="#4A8FE7" stroke-width="2.8" stroke-linecap="round" fill="none"/>
                <!-- Eyelash center: curves straight up -->
                <path d="M50 30 Q50 16 50 6" stroke="#4A8FE7" stroke-width="2.8" stroke-linecap="round" fill="none"/>
                <!-- Eyelash right: curves up and to the right -->
                <path d="M62 34 Q68 18 76 12" stroke="#4A8FE7" stroke-width="2.8" stroke-linecap="round" fill="none"/>
                <!-- Eye shape: almond with pointed ends -->
                <path d="M8 54 C18 34, 34 28, 50 28 C66 28, 82 34, 92 54 C82 72, 66 78, 50 78 C34 78, 18 72, 8 54 Z" stroke="#4A8FE7" stroke-width="2.8" fill="none"/>
                <!-- Iris -->
                <circle cx="50" cy="54" r="15" fill="#4A8FE7"/>
                <!-- Pupil highlight -->
                <circle cx="50" cy="54" r="5.5" fill="#fff"/>
            </svg>
        </div>
        <div class="brand-name">Eyecatcher</div>
        <div class="brand-sub">Video Date</div>
        <h1 class="headline">We caught your eye,<br>now catch theirs</h1>
        <div class="buttons">
            <button class="btn" id="signupBtn">Create Account Using Phone Number</button>
            <button class="btn" id="loginBtn">I Have an Account</button>
        </div>
    </div>
    <div class="spacer-bottom"></div>
    <div class="terms">
        By creating an account, you agree to our
        <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </div>
</body>
</html>
