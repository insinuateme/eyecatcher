<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4A8FE7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Eyecatcher — Video Date</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: #4A8FE7;
            color: #fff;
            padding: 0 24px;
            -webkit-tap-highlight-color: transparent;
        }

        .spacer-top {
            flex: 1;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .logo-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .logo-circle svg {
            width: 110px;
            height: 110px;
        }

        .brand-name {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .brand-sub {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 36px;
        }

        .headline {
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .btn {
            background: #fff;
            color: #4A8FE7;
            border: none;
            padding: 16px 24px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            -webkit-user-select: none;
            user-select: none;
            width: 100%;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .spacer-bottom {
            flex: 1;
        }

        .terms {
            padding: 20px 24px 36px;
            font-size: 0.7rem;
            opacity: 0.7;
            text-align: center;
            line-height: 1.5;
        }

        .terms a {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="spacer-top"></div>
    <div class="content">
        <div class="logo-circle">
            <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Dark circle background -->
                <circle cx="100" cy="100" r="100" fill="#1C1C2E"/>
                <!-- Upper brow accent: thin elegant arc -->
                <path d="M42 82 C60 62, 90 55, 120 58 C140 60, 155 58, 168 52"
                      stroke="#4A8FE7" stroke-width="3" stroke-linecap="round" fill="none"/>
                <!-- Upper eyelid: bold sweeping shape with pointed tail -->
                <path d="M35 102
                         C45 78, 75 66, 105 70
                         C130 73, 150 68, 172 58
                         L170 64
                         C152 74, 132 80, 108 80
                         C80 80, 55 90, 42 102 Z"
                      fill="#4A8FE7"/>
                <!-- Eye opening / iris: almond shape -->
                <path d="M42 104
                         C55 88, 80 82, 108 84
                         C132 86, 150 90, 160 100
                         C150 112, 130 118, 105 118
                         C78 118, 55 116, 42 104 Z"
                      fill="#4A8FE7"/>
                <!-- Pupil: dark center -->
                <ellipse cx="102" cy="101" rx="10" ry="11" fill="#1C1C2E"/>
                <!-- Lower eyelid: thinner curve -->
                <path d="M44 108
                         C58 128, 82 134, 108 130
                         C130 127, 148 118, 158 106"
                      stroke="#4A8FE7" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            </svg>
        </div>
        <div class="brand-name">Eyecatcher</div>
        <div class="brand-sub">Video Date</div>
        <h1 class="headline">We caught your eye,<br>now catch theirs</h1>
        <div class="buttons">
            <button class="btn" id="signupBtn">Create Account Using Phone Number</button>
            <button class="btn" id="loginBtn">I Have an Account</button>
        </div>
    </div>
    <div class="spacer-bottom"></div>
    <div class="terms">
        By creating an account, you agree to our
        <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </div>
</body>
</html>
