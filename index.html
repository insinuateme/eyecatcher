<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6C63FF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Eyecatcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6C63FF 0%, #3F3D99 100%);
            color: #fff;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .wave {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
            animation: wave-anim 2s ease-in-out infinite;
            transform-origin: 70% 70%;
            display: inline-block;
        }

        @keyframes wave-anim {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            50% { transform: rotate(-10deg); }
            75% { transform: rotate(15deg); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1.1rem;
            opacity: 0.85;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn {
            background: #fff;
            color: #6C63FF;
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            -webkit-user-select: none;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .counter {
            margin-top: 20px;
            font-size: 0.95rem;
            opacity: 0.7;
            min-height: 1.5em;
        }

        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="wave" aria-hidden="true">👁️</span>
        <h1>Eyecatcher</h1>
        <p>Grab attention instantly. Tap the button to see what catches your eye!</p>
        <button class="btn" id="helloBtn">Catch My Eye</button>
        <div class="counter" id="counter"></div>
    </div>
    <footer>Eyecatcher — Built with HTML, CSS & JS</footer>

    <script>
        const btn = document.getElementById('helloBtn');
        const counter = document.getElementById('counter');
        let count = 0;

        btn.addEventListener('click', () => {
            count++;
            const catchphrases = [
                'Look here! 👀', 'Stunning! ✨', 'Eye-catching! 🎯',
                'Show-stopper! 🌟', 'Dazzling! 💎', 'Wow factor! 🔥',
                'Brilliant! 💡', 'Captivating! 🎪', 'Mesmerizing! 🌀',
                'Spotlight on! 🔦', 'Stand out! 🏆', 'Turn heads! 💫'
            ];
            const phrase = catchphrases[Math.floor(Math.random() * catchphrases.length)];
            counter.textContent = `${phrase} (tap #${count})`;
        });
    </script>
</body>
</html>
